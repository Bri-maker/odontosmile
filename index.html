
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservar una cita | OdontoSmile</title>
    <meta name="description" content="Reserva tu cita odontológica en OdontoSmile.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0B132B;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            background: #101d3c;
            border-bottom: 1px solid #4682B4;
        }

        .logo {
            color: #00F5D4;
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
        }

        .contenedor {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
            padding: 35px;
            background: #142344;
            border: 1px solid #4682B4;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.08);
        }

        h1 {
            text-align: center;
            color: #00F5D4;
            margin-bottom: 12px;
        }

        .descripcion {
            text-align: center;
            color: #c7d3e8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo.completo {
            grid-column: 1 / -1;
        }

        label {
            color: #e5f1ff;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #4682B4;
            border-radius: 9px;
            background: #0B132B;
            color: #ffffff;
            outline: none;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00F5D4;
            box-shadow: 0 0 8px rgba(0, 245, 212, 0.2);
        }

        input::placeholder, textarea::placeholder {
            color: #9aabc4;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .privacidad {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #c7d3e8;
            font-size: 14px;
            line-height: 1.5;
        }

        .privacidad input {
            width: auto;
            margin-top: 3px;
        }

        button {
            grid-column: 1 / -1;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #00F5D4;
            color: #0B132B;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #mensajeEstado {
            grid-column: 1 / -1;
            text-align: center;
            line-height: 1.5;
            font-weight: bold;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #00F5D4;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .contenedor {
                padding: 22px;
                margin: 25px auto;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo.completo,
            .privacidad,
            button,
            #mensajeEstado {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">OdontoSmile</a>
    </header>

    <main class="contenedor">
        <h1>Reserva tu cita</h1>

        <p class="descripcion">
            Tu sonrisa merece el mejor cuidado.
            Completa el formulario y solicita tu cita odontológica.
        </p>

        <form id="appointmentForm" class="formulario">

            <div class="campo">
                <label for="nombre">Nombre completo *</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tus nombres"
                    required
                >
            </div>

            <div class="campo">
                <label for="telefono">Teléfono *</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Tu número de celular"
                    required
                >
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@gmail.com"
                >
            </div>

            <div class="campo">
                <label for="servicio">Tratamiento *</label>
                <select id="servicio" name="servicio" required>
                    <option value="">Selecciona un tratamiento</option>
                    <option value="Limpieza dental">Limpieza dental</option>
                    <option value="Blanqueamiento dental">Blanqueamiento dental</option>
                    <option value="Ortodoncia">Ortodoncia</option>
                    <option value="Endodoncia">Endodoncia</option>
                    <option value="Implantes dentales">Implantes dentales</option>
                    <option value="Consulta general">Consulta general</option>
                </select>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de cita *</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="campo">
                <label for="hora">Hora de cita *</label>
                <input type="time" id="hora" name="hora" required>
            </div>

            <div class="campo completo">
                <label for="mensaje">Mensaje adicional</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribe alguna consulta o detalle adicional..."
                ></textarea>
            </div>

            <label class="privacidad">
                <input type="checkbox" id="privacidad" required>
                <span>Acepto que mis datos sean utilizados para gestionar mi solicitud de cita.</span>
            </label>

            <p id="mensajeEstado" role="status" aria-live="polite"></p>

            <button type="submit" id="btnEnviar">
                Reservar mi cita
            </button>

        </form>

        <a href="index.html" class="volver">
            ← Volver al inicio
        </a>
    </main>

    <!-- Cargar Supabase antes de configurar el formulario -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        const formulario = document.getElementById("appointmentForm");
        const mensajeEstado = document.getElementById("mensajeEstado");
        const btnEnviar = document.getElementById("btnEnviar");
        const campoFecha = document.getElementById("fecha");

        // Evitar seleccionar fechas anteriores al día actual
        const hoy = new Date();
        const fechaLocal = new Date(
            hoy.getTime() - hoy.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        campoFecha.min = fechaLocal;

        formulario.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            if (typeof supabaseClient === "undefined") {
                mensajeEstado.textContent =
                    "Error: no se pudo conectar con Supabase. Revisa js/supabase.js.";
                mensajeEstado.style.color = "#ff7777";
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.textContent = "Registrando cita...";
            mensajeEstado.textContent = "";

            const datos = {
                nombre: document.getElementById("nombre").value.trim(),
                telefono: document.getElementById("telefono").value.trim(),
                correo: document.getElementById("correo").value.trim() || null,
                tratamiento: document.getElementById("servicio").value,
                fecha_cita: document.getElementById("fecha").value,
                hora: document.getElementById("hora").value,
                mensaje: document.getElementById("mensaje").value.trim() || null
            };

            try {
                const { error } = await supabaseClient
                    .from("citas")
                    .insert([datos]);

                if (error) {
                    throw error;
                }

                mensajeEstado.textContent =
                    "¡Tu solicitud fue registrada correctamente!";
                mensajeEstado.style.color = "#00F5D4";

                // Cambia este número por el WhatsApp real de la clínica
                const numeroWhatsApp = "51900000000";

                const textoWhatsApp =
                    "¡Hola, OdontoSmile! Deseo confirmar mi solicitud de cita.%0A%0A" +
                    "Nombre: " + encodeURIComponent(datos.nombre) + "%0A" +
                    "Teléfono: " + encodeURIComponent(datos.telefono) + "%0A" +
                    "Correo: " + encodeURIComponent(datos.correo || "No indicado") + "%0A" +
                    "Tratamiento: " + encodeURIComponent(datos.tratamiento) + "%0A" +
                    "Fecha: " + encodeURIComponent(datos.fecha_cita) + "%0A" +
                    "Hora: " + encodeURIComponent(datos.hora) + "%0A" +
                    "Mensaje: " + encodeURIComponent(datos.mensaje || "Sin mensaje");

                const urlWhatsApp =
                    "https://wa.me/" + numeroWhatsApp + "?text=" + textoWhatsApp;

                window.open(urlWhatsApp, "_blank");

                formulario.reset();
                campoFecha.min = fechaLocal;

            } catch (error) {
                console.error("Error al registrar la cita:", error);

                mensajeEstado.textContent =
                    "No se pudo registrar la cita. Verifica tu conexión e inténtalo nuevamente.";
                mensajeEstado.style.color = "#ff7777";

            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = "Reservar mi cita";
            }
        });
    </script>

</body>
</html>
