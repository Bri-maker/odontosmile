<!-- ==========================================
     PANEL DE CITAS GUARDADAS EN SUPABASE
========================================== -->

<section id="citas-guardadas" class="citas-section">
    <div class="citas-container">

        <div class="citas-header">
            <div>
                <span class="citas-tag">BASE DE DATOS EN VIVO</span>
                <h2>Citas registradas</h2>
                <p>Información almacenada en nuestra plataforma.</p>
            </div>

            <button id="actualizarCitas" class="btn-actualizar">
                ↻ Actualizar
            </button>
        </div>

        <div class="citas-stats">
            <div class="cita-stat">
                <span>Total de citas</span>
                <strong id="totalCitas">0</strong>
            </div>

            <div class="cita-stat">
                <span>Tratamientos diferentes</span>
                <strong id="totalTratamientos">0</strong>
            </div>
        </div>

        <div class="citas-table-wrapper">
            <table class="citas-table">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Tratamiento</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Mensaje</th>
                    </tr>
                </thead>

                <tbody id="tablaCitas">
                    <tr>
                        <td colspan="7">Cargando registros...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="estadoCitas" class="estado-citas"></p>

    </div>
</section>

<style>
.citas-section {
    padding: 75px 5%;
    background: #0B132B;
    color: #EDF7FF;
}

.citas-container {
    max-width: 1250px;
    margin: auto;
}

.citas-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.citas-tag {
    color: #00F5D4;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: bold;
}

.citas-header h2 {
    font-size: 32px;
    margin: 12px 0;
}

.citas-header p {
    color: #9AACC7;
}

.btn-actualizar {
    background: #4682B4;
    border: none;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    cursor: pointer;
}

.citas-stats {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.cita-stat {
    background: #111E3B;
    border: 1px solid #4682B4;
    padding: 22px;
    border-radius: 15px;
    min-width: 190px;
}

.cita-stat span {
    display: block;
    color: #9AACC7;
    margin-bottom: 10px;
}

.cita-stat strong {
    font-size: 30px;
    color: #00F5D4;
}

.citas-table-wrapper {
    overflow-x: auto;
    background: #111E3B;
    border-radius: 15px;
    border: 1px solid #263D60;
}

.citas-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 950px;
}

.citas-table th,
.citas-table td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #263D60;
    font-size: 13px;
}

.citas-table th {
    color: #00F5D4;
    background: #162747;
}

.citas-table td {
    color: #EDF7FF;
}

.citas-table tr:hover td {
    background: #192D50;
}

.estado-citas {
    margin-top: 15px;
    color: #9EC9E8;
}

@media(max-width:700px) {
    .citas-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .citas-header h2 {
        font-size: 25px;
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    const tabla = document.getElementById("tablaCitas");
    const estado = document.getElementById("estadoCitas");

    /*
      Utiliza el cliente que ya tienes en js/supabase.js.
      No crea otra conexión ni cambia tus credenciales.
    */

    const clienteSupabase =
        window.supabaseClient ||
        window.supabaseDB ||
        window.supabase_cliente;

    if (!clienteSupabase) {
        tabla.innerHTML = `
            <tr>
                <td colspan="7">
                    No se encontró el cliente de Supabase.
                    Revisa el nombre de la variable en js/supabase.js.
                </td>
            </tr>`;
        return;
    }

    async function cargarCitas() {

        tabla.innerHTML = `
            <tr><td colspan="7">Cargando registros...</td></tr>`;

        estado.textContent = "";

        try {

            // Cambia "citas" únicamente si tu tabla tiene otro nombre.
            const { data, error } = await clienteSupabase
                .from("citas")
                .select(`
                    id,
                    created_at,
                    nombre,
                    correo,
                    telefono,
                    tratamiento,
                    fecha_cita,
                    mensaje,
                    hora
                `)
                .order("created_at", { ascending: false });

            if (error) throw error;

            document.getElementById("totalCitas").textContent =
                data.length;

            document.getElementById("totalTratamientos").textContent =
                new Set(data.map(c => c.tratamiento).filter(Boolean)).size;

            if (!data.length) {
                tabla.innerHTML = `
                    <tr><td colspan="7">Todavía no hay citas registradas.</td></tr>`;
                return;
            }

            tabla.innerHTML = "";

            data.forEach(cita => {

                const fila = document.createElement("tr");

                [
                    cita.nombre,
                    cita.correo,
                    cita.telefono,
                    cita.tratamiento,
                    cita.fecha_cita,
                    cita.hora,
                    cita.mensaje
                ].forEach(valor => {
                    const celda = document.createElement("td");
                    celda.textContent = valor || "—";
                    fila.appendChild(celda);
                });

                tabla.appendChild(fila);
            });

            estado.textContent =
                "Se cargaron " + data.length + " registros correctamente.";

        } catch (error) {

            console.error("Error al consultar las citas:", error);

            tabla.innerHTML = `
                <tr>
                    <td colspan="7">
                        No se pudieron cargar los registros.
                        Verifica el nombre de la tabla y los permisos de lectura.
                    </td>
                </tr>`;

            estado.textContent = error.message;
        }
    }

    document.getElementById("actualizarCitas")
        .addEventListener("click", cargarCitas);

    cargarCitas();

});
</script>
