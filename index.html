
<script>
const TABLA_CITAS = "citas";
let sesionAdmin = false;

// Obtener la conexión que ya tienes en js/supabase.js
function obtenerClienteSupabase() {
  if (window.supabaseClient) return window.supabaseClient;
  if (window.supabase_client) return window.supabase_client;
  if (window.clienteSupabase) return window.clienteSupabase;

  try {
    if (typeof supabaseClient !== "undefined") return supabaseClient;
  } catch(e) {}

  try {
    if (typeof clienteSupabase !== "undefined") return clienteSupabase;
  } catch(e) {}

  return null;
}

const db = obtenerClienteSupabase();

function abrirModal() {
  document.getElementById("modalCuenta").classList.add("show");
  document.getElementById("mensajeLogin").textContent = "";
}

function cerrarModal() {
  document.getElementById("modalCuenta").classList.remove("show");
}

function toggleChat() {
  document.getElementById("chatBox").classList.toggle("open");
}

// INICIO DE SESIÓN DE DEMOSTRACIÓN
function loginAdmin() {
  const usuario = document.getElementById("usuarioAdmin").value.trim();
  const password = document.getElementById("passwordAdmin").value;
  const mensaje = document.getElementById("mensajeLogin");

  if (usuario === "Admin" && password === "admin") {
    sesionAdmin = true;

    cerrarModal();

    document.getElementById("panelCuenta").classList.add("show");
    document.getElementById("estadoEstadisticas").textContent =
      "Conectando con Supabase...";

    actualizarEstadisticas();

    document.getElementById("panelCuenta").scrollIntoView({
      behavior: "smooth"
    });

  } else {
    mensaje.textContent = "Usuario o contraseña incorrectos.";
    mensaje.style.color = "#ff5555";
  }
}

// FECHA DE PERÚ
function fechaLima(fecha) {
  if (!fecha) return "";

  const valor = new Date(fecha);
  if (isNaN(valor.getTime())) return "";

  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Lima",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(valor);
}

// CONSULTAR ESTADÍSTICAS DE SUPABASE
async function actualizarEstadisticas() {
  const estado = document.getElementById("estadoEstadisticas");

  if (!sesionAdmin) {
    estado.textContent = "Inicia sesión como administrador.";
    return;
  }

  if (!db) {
    estado.textContent =
      "No se encontró la conexión. Revisa js/supabase.js.";
    return;
  }

  estado.textContent = "Consultando datos de Supabase...";

  try {
    const { data, error } = await db
      .from(TABLA_CITAS)
      .select("id, created_at, fecha_cita");

    if (error) throw error;

    const registros = data || [];
    const hoy = fechaLima(new Date().toISOString());
    const mesActual = hoy.substring(0, 7);

    const cantidadHoy = registros.filter(registro =>
      fechaLima(registro.created_at) === hoy
    ).length;

    const cantidadMes = registros.filter(registro =>
      fechaLima(registro.created_at).substring(0, 7) === mesActual
    ).length;

    const cantidadCitasHoy = registros.filter(registro =>
      String(registro.fecha_cita || "").substring(0, 10) === hoy
    ).length;

    document.getElementById("clientesHoy").textContent = cantidadHoy;
    document.getElementById("clientesMes").textContent = cantidadMes;
    document.getElementById("totalClientes").textContent = registros.length;
    document.getElementById("citasHoy").textContent = cantidadCitasHoy;

    estado.textContent =
      "✓ Estadísticas actualizadas correctamente desde Supabase.";

  } catch (error) {
    console.error("Error de Supabase:", error);

    estado.textContent =
      "Error: " + error.message +
      ". Comprueba la tabla y los permisos de lectura.";
  }
}

// CERRAR SESIÓN
function cerrarSesion() {
  sesionAdmin = false;

  document.getElementById("panelCuenta").classList.remove("show");
  document.getElementById("usuarioAdmin").value = "";
  document.getElementById("passwordAdmin").value = "";
  document.getElementById("estadoEstadisticas").textContent =
    "Sesión cerrada.";

  document.getElementById("inicio").scrollIntoView({
    behavior: "smooth"
  });
}
</script>
</body>
</html>
