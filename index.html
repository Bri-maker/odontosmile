<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Contacto | OdontoSmile PASCO</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --steel: #4682B4;
  --steel-light: #9EC9E8;
  --neon: #00F5D4;
  --night: #0B132B;
  --panel: #111E3B;
  --text: #EDF7FF;
  --muted: #9AACC7;
  --line: rgba(151,190,221,0.16);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(70,130,180,.18), transparent 40%),
    var(--night);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 15px;
}

.form-container {
  width: 100%;
  max-width: 850px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 45px;
  box-shadow: 0 25px 70px rgba(0,0,0,.35);
  position: relative;
  overflow: hidden;
}

.form-container::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  background: var(--neon);
  filter: blur(130px);
  opacity: .12;
  top: -50px;
  right: -30px;
}

.form-header {
  text-align: center;
  margin-bottom: 35px;
}

.form-header .tag {
  display: inline-block;
  color: var(--neon);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

.form-header h1 {
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 12px;
}

.form-header h1 span {
  color: var(--neon);
}

.form-header p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #0B1730;
  color: var(--text);
  outline: none;
  font-family: inherit;
  font-size: 12px;
  transition: .3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 3px rgba(0,245,212,.08);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #7185A5;
}

.form-group select option {
  background: var(--panel);
}

.form-group textarea {
  resize: vertical;
  min-height: 110px;
}

.privacy {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 25px;
}

.privacy input {
  accent-color: var(--neon);
  margin-top: 3px;
}

.btn-submit {
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 10px;
  background: var(--neon);
  color: var(--night);
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .3s;
}

.btn-submit:hover {
  background: var(--steel-light);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,245,212,.18);
}

.form-footer {
  text-align: center;
  margin-top: 22px;
  font-size: 11px;
  color: var(--muted);
}

@media(max-width:600px) {
  .form-container {
    padding: 25px 20px;
  }

  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .form-header h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="form-container">

  <div class="form-header">
    <span class="tag">✦ ODONTOSMILE PASCO</span>
    <h1>Agenda tu <span>cita</span></h1>
    <p>Completa el formulario y solicita tu atención odontológica.<br>
    Estamos listos para cuidar tu sonrisa.</p>
  </div>

  <form id="appointmentForm">

    <div class="form-row">
      <div class="form-group">
        <label for="nombre">Nombre completo *</label>
        <input type="text" id="nombre" placeholder="Ingresa tus nombres" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono *</label>
        <input type="tel" id="telefono" placeholder="987654321"
        pattern="[0-9]{9}" maxlength="9" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="ejemplo@gmail.com">
      </div>

      <div class="form-group">
        <label for="servicio">Especialidad *</label>
        <select id="servicio" required>
          <option value="">Selecciona una especialidad</option>
          <option>Odontología General</option>
          <option>Ortodoncia</option>
          <option>Endodoncia</option>
          <option>Estética Dental</option>
          <option>Odontopediatría</option>
          <option>Implantes Dentales</option>
          <option>Otros tratamientos</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="fecha">Fecha de cita *</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="hora">Hora preferida *</label>
        <select id="hora" required>
          <option value="">Selecciona una hora</option>
          <option>09:00 AM</option>
          <option>10:00 AM</option>
          <option>11:00 AM</option>
          <option>12:00 PM</option>
          <option>02:00 PM</option>
          <option>03:00 PM</option>
          <option>04:00 PM</option>
          <option>05:00 PM</option>
          <option>06:00 PM</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="mensaje">Mensaje adicional</label>
      <textarea id="mensaje" placeholder="Cuéntanos cómo podemos ayudarte..."></textarea>
    </div>

    <label class="privacy">
      <input type="checkbox" required>
      <span>Acepto el uso de mis datos para gestionar mi solicitud de cita.</span>
    </label>

    <button type="submit" class="btn-submit">
      ENVIAR SOLICITUD DE CITA →
    </button>

    <div class="form-footer">
      ✦ OdontoSmile PASCO | Cuidamos tu sonrisa.
    </div>

  </form>
</div>

<script>
const formulario = document.getElementById("appointmentForm");

const fecha = document.getElementById("fecha");
const hoy = new Date();
const fechaLocal = new Date(
  hoy.getTime() - hoy.getTimezoneOffset() * 60000
).toISOString().split("T")[0];

fecha.min = fechaLocal;

formulario.addEventListener("submit", function(e) {
  e.preventDefault();

  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const servicio = document.getElementById("servicio").value;
  const dia = document.getElementById("fecha").value;
  const hora = document.getElementById("hora").value;
  const mensaje = document.getElementById("mensaje").value.trim();

  const numeroWhatsApp = "51900000000";

  const texto = `
¡Hola OdontoSmile PASCO! Solicito una cita odontológica.

Nombre: ${nombre}
Teléfono: ${telefono}
Correo: ${correo || "No proporcionado"}
Especialidad: ${servicio}
Fecha: ${dia}
Hora: ${hora}
Mensaje: ${mensaje || "Sin mensaje adicional"}

Espero su confirmación.`;

  const url = "https://wa.me/" + numeroWhatsApp +
    "?text=" + encodeURIComponent(texto);

  window.open(url, "_blank");
});
</script>

</body>
</html>


  <script src="./js/main.js"></script>
</body>
